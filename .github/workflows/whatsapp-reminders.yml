name: Lembretes no WhatsApp e no aparelho

# Avisa a Maria (WhatsApp, 24h e ~1h antes) e o cliente (push no aparelho,
# confirmado + 24h e ~1h antes) de cada atendimento confirmado.
# Para não duplicar mensagens, cada aviso é registrado na tabela reminders_log.

on:
  schedule:
    # A cada 10 minutos (o GitHub pode atrasar alguns minutos)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não envia e não registra)"
        type: boolean
        default: false
      test_message:
        description: "Enviar apenas uma mensagem/aviso de teste"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: whatsapp-reminders
  cancel-in-progress: false

jobs:
  reminders:
    name: Enviar lembretes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Avisos para o cliente (push no aparelho — grátis)
        run: node scripts/send-client-push.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STUDIO_TIMEZONE: America/Campo_Grande
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_MESSAGE: ${{ inputs.test_message }}

      - name: Avisos para a Maria (WhatsApp)
        run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STUDIO_TIMEZONE: America/Campo_Grande
          WHATSAPP_PROVIDER: callmebot
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || '554591096203' }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_MESSAGE: ${{ inputs.test_message }}
