const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('logo'), defs=document.getElementById('defs');
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};

/* --- montagem das camadas --- */
const root=el('g',{id:'root'},svg);
const G={};
function layer(name,parent=root,mask){
  const [x,y,w,h,src]=LAYERS[name];
  const g=el('g',{},parent); if(mask) g.setAttribute('mask',`url(#${mask})`);
  el('image',{href:src,x,y,width:w,height:h},g);
  G[name]=g; return g;
}
/* máscara de traço (desenha ao longo de um caminho) */
function strokeMask(id,d,width){
  const m=el('mask',{id,maskUnits:'userSpaceOnUse',x:0,y:0,width:1254,height:1254},defs);
  return el('path',{d,fill:'none',stroke:'#fff','stroke-width':width,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},m);
}
/* máscara de revelação com borda suave */
let gid=0;
function wipeMask(id,name,dir='lr',edge=60){
  const [x,y,w,h]=LAYERS[name], pad=12;
  const m=el('mask',{id,maskUnits:'userSpaceOnUse',x:0,y:0,width:1254,height:1254},defs);
  const gr=el('linearGradient',{id:'g'+(++gid),x1:dir==='lr'?0:1,x2:dir==='lr'?1:0,y1:0,y2:0},defs);
  const W=w+2*pad+edge;
  el('stop',{offset:(1-edge/W).toFixed(3),'stop-color':'#fff'},gr);
  el('stop',{offset:1,'stop-color':'#fff','stop-opacity':0},gr);
  const rx=dir==='lr'?x-pad:x-pad-edge;
  const r=el('rect',{x:rx,y:y-pad,width:W,height:h+2*pad,fill:`url(#g${gid})`},m);
  r._dist=dir==='lr'?-W:W; r.style.transform=`translateX(${r._dist}px)`;
  return r;
}
/* máscara circular (pincel pintando a unha) */
function circleMask(id,cx,cy){
  const m=el('mask',{id,maskUnits:'userSpaceOnUse',x:0,y:0,width:1254,height:1254},defs);
  const c=el('circle',{cx,cy,r:115,fill:'#fff'},m);
  c.style.transformOrigin=`${cx}px ${cy}px`; c.style.transform='scale(0)'; return c;
}

const M={};
M.arc=strokeMask('mArc','M435,621 A270,270 0 1 1 752,184 L768,156',84);
M.sw=strokeMask('mSw',SWOOSH,34);
M.brow=wipeMask('mBrow','brow','lr',120);
M.eye=wipeMask('mEye','eye','lr',110);
M.swash=wipeMask('mSwash','swash','lr',60);
M.lineL=wipeMask('mLL','lineL','rl',30);
M.lineR=wipeMask('mLR','lineR','lr',30);
M.bl=wipeMask('mBL','bl','lr',24);
M.br=wipeMask('mBR','br','rl',24);
const NAILBASE=[[852,262],[832,330],[782,458],[796,518]];
M.nails=NAILBASE.map((p,i)=>circleMask('mN'+i,p[0],p[1]));

layer('arc',root,'mArc');
layer('brow',root,'mBrow');
const eyeWrap=el('g',{},root); layer('eye',eyeWrap,'mEye'); G.eyeWrap=eyeWrap;
const handWrap=el('g',{},root); G.handWrap=handWrap;
const handSway=el('g',{},handWrap); G.handSway=handSway;
layer('hand',handSway); [0,1,2,3].forEach(i=>layer('nail'+i,handSway,'mN'+i));
layer('swoosh',root,'mSw');
const word=el('g',{},root);
['L_M','L_e','L_l','L_r','L_y'].forEach(n=>layer(n,word));
layer('swash',word,'mSwash');
for(let i=0;i<12;i++) layer('B'+i);
layer('lineL',root,'mLL'); layer('lineR',root,'mLR');
['s0','d0','s1','d1','s2'].forEach(n=>layer(n));
/* barra de progresso: trilho claro + preenchimento */
const track=el('g',{opacity:.12},root);
['bl','br'].forEach(n=>{const [x,y,w,h,src]=LAYERS[n];el('image',{href:src,x,y,width:w,height:h},track)});
G.track=track;
layer('bl',root,'mBL'); layer('br',root,'mBR');
const heartWrap=el('g',{},root); G.heartWrap=heartWrap; layer('bheart',heartWrap);

/* --- utilidades de animação --- */
let anims=[], timers=[];
const ease={out:'cubic-bezier(.22,1,.36,1)',inout:'cubic-bezier(.65,0,.35,1)',back:'cubic-bezier(.34,1.56,.64,1)'};
function A(node,frames,opt){const a=node.animate(frames,Object.assign({fill:'both',easing:ease.out},opt));anims.push(a);return a}
function center(name){const [x,y,w,h]=LAYERS[name];return [x+w/2,y+h/2]}
function origin(node,x,y){node.style.transformOrigin=`${x}px ${y}px`}
function later(fn,ms){timers.push(setTimeout(fn,ms))}

/* --- progresso (pode ser controlado de fora) --- */
let progress=0, isDone=false, demo=!/manual/.test(location.search);
function setProgress(p){
  progress=Math.max(0,Math.min(1,p));
  M.bl.style.transform=`translateX(${M.bl._dist*(1-progress)}px)`;
  M.br.style.transform=`translateX(${M.br._dist*(1-progress)}px)`;
  if(progress>=1&&!isDone) done();
}

function flutter(delay=0){
  origin(G.eyeWrap,580,438);
  A(G.eyeWrap,[{transform:'scaleY(1)'},{transform:'scaleY(.84) translateY(4px)',offset:.25},{transform:'scaleY(1.02)',offset:.5},{transform:'scaleY(.9) translateY(2px)',offset:.7},{transform:'scaleY(1)'}],{duration:700,delay,easing:'ease-in-out',fill:'none'});
}
function beat(big){
  origin(G.heartWrap,627,1106);
  const s=big?1.45:1.2;
  return A(G.heartWrap,[{transform:'scale(1)'},{transform:`scale(${s})`,offset:.18},{transform:'scale(.96)',offset:.34},{transform:`scale(${1+(s-1)*.55})`,offset:.48},{transform:'scale(1)',offset:.7},{transform:'scale(1)'}],{duration:big?900:1150,easing:'ease-in-out',fill:'none',iterations:big?1:Infinity});
}

function play(){
  anims.forEach(a=>a.cancel()); anims=[]; timers.forEach(clearTimeout); timers=[];
  isDone=false; setProgress(0);
  A(root,[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:900});
  origin(root,627,627);

  // 1. contorno circular se desenhando
  A(M.arc,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:1400,easing:ease.inout});
  // 2. sobrancelha "fio a fio"
  A(M.brow,[{transform:`translateX(${M.brow._dist}px)`},{transform:'translateX(0)'}],{duration:1100,delay:450,easing:ease.inout});
  // 3. olho e cílios
  A(M.eye,[{transform:`translateX(${M.eye._dist}px)`},{transform:'translateX(0)'}],{duration:1000,delay:900,easing:ease.inout});
  later(()=>flutter(),1950);
  // 4. mão entra
  origin(G.handWrap,930,640);
  A(G.handWrap,[{opacity:0,transform:'translate(90px,60px) rotate(14deg)'},{opacity:1,transform:'translate(0,0) rotate(0)'}],{duration:1100,delay:1300,easing:ease.back});
  // 5. unhas pintadas uma a uma
  M.nails.forEach((c,i)=>A(c,[{transform:'scale(0)'},{transform:'scale(1)'}],{duration:500,delay:2200+i*170,easing:ease.out}));
  // 6. linha ondulada até o coração
  A(M.sw,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:1100,delay:2300,easing:ease.inout});
  // 7. nome Melry letra a letra
  ['L_M','L_e','L_l','L_r','L_y'].forEach((n,i)=>{
    const [cx]=center(n); origin(G[n],cx,830);
    A(G[n],[{opacity:0,transform:'translateY(46px) scale(.82)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:750,delay:2800+i*120,easing:ease.back});
  });
  A(M.swash,[{transform:`translateX(${M.swash._dist}px)`},{transform:'translateX(0)'}],{duration:750,delay:3450,easing:ease.inout});
  // 8. BEAUTY STUDIO se aproximando
  for(let i=0;i<12;i++){
    const [cx]=center('B'+i);
    A(G['B'+i],[{opacity:0,transform:`translateX(${(cx-630)*.55}px)`},{opacity:1,transform:'translateX(0)'}],{duration:900,delay:3650+Math.abs(i-5.5)*30,easing:ease.out});
  }
  A(M.lineL,[{transform:`translateX(${M.lineL._dist}px)`},{transform:'translateX(0)'}],{duration:700,delay:4150});
  A(M.lineR,[{transform:`translateX(${M.lineR._dist}px)`},{transform:'translateX(0)'}],{duration:700,delay:4150});
  // 9. serviços
  ['s0','d0','s1','d1','s2'].forEach((n,i)=>{
    const [cx,cy]=center(n); origin(G[n],cx,cy);
    const dot=n[0]==='d';
    A(G[n],[{opacity:0,transform:dot?'scale(0)':'translateY(18px)'},{opacity:1,transform:dot?'scale(1)':'translateY(0)'}],{duration:dot?500:700,delay:4450+i*130,easing:dot?ease.back:ease.out});
  });
  // coração + trilho aparecem logo no início e o coração pulsa enquanto carrega
  A(G.track,[{opacity:0},{opacity:.16}],{duration:500});
  A(G.heartWrap,[{opacity:0},{opacity:1}],{duration:500});
  beat(false);
  // movimentos contínuos
  origin(G.handSway,935,630);
  later(()=>A(G.handSway,[{transform:'rotate(0)'},{transform:'rotate(-1.6deg)'},{transform:'rotate(.8deg)'},{transform:'rotate(0)'}],{duration:4200,iterations:Infinity,easing:'ease-in-out',fill:'none'}),2600);

  if(demo){ // progresso simulado
    const t0=performance.now(), dur=5600;
    const tick=t=>{ if(isDone) return; const k=Math.min(1,(t-t0)/dur); setProgress(k<1?1-Math.pow(1-k,1.35):1); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
}

function done(){
  isDone=true;
  later(()=>{anims.filter(a=>a.effect&&a.effect.target===G.heartWrap&&a.effect.getTiming().iterations===Infinity).forEach(a=>a.cancel());beat(true);},200);
  later(()=>flutter(),700);
  later(()=>{ beat(false); },1200);
  window.dispatchEvent(new Event('melry:loaded'));
  if(demo){
    later(()=>A(root,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.03)'}],{duration:600,easing:ease.inout}),3600);
    later(play,4300);
  }
}
// piscadinha periódica dos cílios
setInterval(()=>{ if(document.visibilityState==='visible') flutter(); },4200);

document.addEventListener('click',play);
window.MelryLoader={play,setProgress,done};
play();
</script>
</body>
</html>
